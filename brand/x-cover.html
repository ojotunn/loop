<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Capa do X: 1500x500, renderizada a 2x (3000x1000) e reduzida depois. */
  html, body { margin: 0; background: #0b0b0d; color: #f2efe9; font-family: "Manrope", system-ui, sans-serif; }
  body { width: 3000px; height: 1000px; overflow: hidden; position: relative; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; gap: 120px; padding: 0 260px; box-sizing: border-box; }
  svg.mark { width: 420px; height: 420px; flex: none; }
  h1 { font-weight: 700; font-size: 124px; line-height: 1.04; margin: 0 0 30px; letter-spacing: -.035em; }
  p { font-size: 44px; color: #9b9891; margin: 0; line-height: 1.35; font-weight: 500; max-width: 1500px; }
  .tag { position: absolute; right: 260px; bottom: 70px; font-size: 30px; font-weight: 600; color: #9b9891; letter-spacing: .1em; text-transform: uppercase; }
  .embers { position: absolute; inset: 0; pointer-events: none; }
</style></head>
<body>
<svg class="embers" viewBox="0 0 3000 1000" xmlns="http://www.w3.org/2000/svg">
  <g fill="#ff5a1f">
    <circle cx="180" cy="820" r="4" opacity=".55"/><circle cx="420" cy="140" r="3" opacity=".35"/><circle cx="760" cy="900" r="5" opacity=".4"/>
    <circle cx="1220" cy="120" r="3" opacity=".3"/><circle cx="1650" cy="880" r="4" opacity=".45"/><circle cx="1980" cy="180" r="3" opacity=".35"/>
    <circle cx="2300" cy="760" r="5" opacity=".4"/><circle cx="2620" cy="240" r="3" opacity=".3"/><circle cx="2840" cy="640" r="4" opacity=".5"/>
    <circle cx="980" cy="520" r="2" opacity=".25"/><circle cx="2100" cy="470" r="2" opacity=".25"/><circle cx="2740" cy="900" r="3" opacity=".35"/>
  </g>
</svg>
<div class="wrap">
  <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#ff5a1f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="32" r="19" pathLength="100" stroke-dasharray="80 20" transform="rotate(-60 32 32)"/>
      <path d="M23.8 13.9 L21.1 22.9 L14.5 15.5 Z" fill="#ff5a1f" stroke="none"/>
    </g>
  </svg>
  <div>
    <h1>A token that is born,<br>dies, and is born again.</h1>
    <p>Every loop launches $LOOP with everything the last one earned. The last loop buys the whole curve and burns it.</p>
  </div>
</div>
<div class="tag">loopagent.run · on pons v2 · Robinhood Chain</div>
</body></html>
